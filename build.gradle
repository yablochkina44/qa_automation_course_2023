plugins {
    id 'java-library'
    id("io.qameta.allure") version "3.0.2"
}

repositories {
    mavenCentral()
}

allure {
    version = "2.34.1"
}

dependencies {
    testImplementation "com.codeborne:selenide:6.19.1" //для работы с хромом

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testRuntimeOnly  "org.junit.jupiter:junit-jupiter-engine:5.10.2"

    // 🔴 ВАЖНО ДЛЯ GRADLE 9
    testRuntimeOnly  "org.junit.platform:junit-platform-launcher:1.10.2"
    testImplementation "org.slf4j:slf4j-simple:2.0.13"

    //files
    // ⚡ ОБНОВЛЕННЫЕ ФАЙЛОВЫЕ ЗАВИСИМОСТИ (совместимые друг с другом)
    testImplementation 'org.assertj:assertj-core:3.27.3'        // новая, но совместима
    testImplementation 'com.codeborne:pdf-test:1.8.1'          // обновлена
    testImplementation 'com.codeborne:xls-test:1.7.0'          // обновлена
    testImplementation 'com.opencsv:opencsv:5.10'               // обновлена
    testImplementation 'com.google.code.gson:gson:2.12.1'      // обновлена
    // ⚡ Добавь ЭТИ две строки для работы с Excel
    testImplementation 'org.apache.poi:poi:5.4.0'
    testImplementation 'org.apache.poi:poi-ooxml:5.4.0'

    // Jackson для работы с JSON (databind тянет core и annotations)
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.13.1'
    implementation 'com.github.javafaker:javafaker:1.0.2'
    implementation 'io.qameta.allure:allure-selenide:2.21.0'
    testImplementation 'io.qameta.allure:allure-junit5:2.21.0'

}


tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8' //поддержка кирилицы
}
compileTestJava

test {
    useJUnitPlatform()
}

tasks.register('registrations_test', Test) {
    classpath = test.classpath
    testClassesDirs = test.testClassesDirs
    useJUnitPlatform {
        includeTags("RegistrationForm")
    }
}
